<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Diagram Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="palette">
            <h2>Elements</h2>
            <select id="network-type-selector" style="width: 100%; margin-bottom: 15px; padding: 5px;">
                <option value="standard">Standard</option>
                <option value="3gpp">3GPP Mobile</option>
                <option value="5gsa">5G SA Mobile</option>
            </select>
            <div id="palette-elements">
                <!-- Dynamically populated -->
            </div>

            <hr style="width: 100%; border: 1px solid #ccc; margin: 15px 0;">

<h2>Properties</h2>
            <div class="property-group" id="node-properties" style="display: block;">
                <label>Background Color:</label>
                <div id="color-presets" class="color-presets disabled">
                    <!-- Dynamically populated -->
                </div>
                <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                    <label for="node-color" style="font-size: 0.9em; color: #555;">Custom:</label>
                    <input type="color" id="node-color" value="#ffffff" disabled>
                </div>
            </div>

            <div class="property-group" id="connection-properties" style="display: none;">
                <label>Flow Direction:</label>
                <select id="connection-flow" class="status-select">
                    <option value="forward">➡️ Forward</option>
                    <option value="reverse">⬅️ Reverse</option>
                    <option value="bidirectional">↔️ Bidirectional</option>
                </select>
                <label style="margin-top: 10px; display: block; font-size: 0.9em;">Connection Status:</label>
                <select id="connection-status" class="status-select">
                    <option value="normal">🟢 Normal</option>
                    <option value="congested">🟡 Congested</option>
                    <option value="down">🔴 Down</option>
                </select>
                <label style="margin-top: 10px; display: block; font-size: 0.9em;">Sequence Order:</label>
                <input type="text" id="connection-sequence" class="status-select" placeholder="e.g. 1, 3" />
                <div style="margin-top: 10px; font-size: 0.85em; color: #666;">
                    Select a connection to modify properties.
                </div>
            </div>

            <hr style="width: 100%; border: 1px solid #ccc; margin: 15px 0;">

            <h2>Actions</h2>
            <div class="toolbar">
                <button id="btn-play-sequence" class="tool-btn" style="background-color: #28a745; color: white; border-color: #28a745;">Play Sequence</button>
                <button id="btn-save" class="tool-btn">Save JSON</button>
                <button id="btn-load" class="tool-btn">Load JSON</button>
                <input type="file" id="load-file" accept=".json" style="display: none;">
                <button id="btn-export-svg" class="tool-btn">Export SVG</button>
                <button id="btn-export-png" class="tool-btn">Export PNG</button>
                <button id="btn-clear" class="tool-btn btn-danger">Clear Canvas</button>
            </div>
        </div>
        <div id="canvas-container">
            <svg id="connection-layer"></svg>
            <div id="canvas"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
